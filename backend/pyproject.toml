[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["analyzer", "evolution", "research", "knowledge_base", "api", "middleware", "models", "utils"]

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "scripts/*"]
